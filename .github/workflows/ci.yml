name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Python 单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装 pytest
        run: pip install pytest
      - name: 运行测试
        run: python -m pytest tests/ -v

  build:
    name: 前端构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: 安装依赖
        working-directory: web
        run: npm ci
      - name: 构建（vue-tsc 类型检查 + vite build）
        working-directory: web
        run: npm run build
